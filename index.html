<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <meta name="theme-color" content="#1f2547" />
  <title>Caixa AAA</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet" />

  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

  <style>
    :root {
      --brand:        #1f2547;
      --brand-deep:   #161a35;
      --brand-soft:   #e8eaf3;
      --bg:           #f4f5f9;
      --surface:      #ffffff;
      --ink:          #14152a;
      --ink-soft:     #4a4d65;
      --muted:        #8b8ea3;
      --rule:         #e3e5ee;
      --cash:         #0e7c5a;
      --cash-soft:    #d6f0e6;
      --pix:          #2f6bd1;
      --pix-soft:     #dde9fa;
      --card:         #b06b1c;
      --card-soft:    #f5e7d2;
      --danger:       #b53939;
      --danger-soft:  #fbe1e1;
      --success:      #0e7c5a;
      --shadow-sm:    0 1px 2px rgba(20, 21, 42, 0.04);
      --shadow:       0 4px 16px -4px rgba(20, 21, 42, 0.08);
      --shadow-lg:    0 24px 48px -16px rgba(20, 21, 42, 0.18);
      --radius:       14px;
      --radius-sm:    10px;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      padding: 0;
      background: var(--bg);
      color: var(--ink);
      font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
      -webkit-font-smoothing: antialiased;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      min-height: 100vh;
    }

    .mono {
      font-family: 'JetBrains Mono', ui-monospace, monospace;
      font-variant-numeric: tabular-nums;
    }

    button { font-family: inherit; cursor: pointer; }
    input, select, textarea { font-family: inherit; }

    /* buttons */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.45rem;
      font-size: 0.9rem;
      font-weight: 600;
      padding: 0.65rem 1rem;
      border-radius: var(--radius-sm);
      border: 1px solid var(--rule);
      background: var(--surface);
      color: var(--ink);
      transition: all 120ms ease;
      box-shadow: var(--shadow-sm);
    }
    .btn:hover { background: #fafbfd; border-color: #c9ccd8; transform: translateY(-1px); }
    .btn:active { transform: translateY(0); }
    .btn-primary { background: var(--brand); color: #fff; border-color: var(--brand); }
    .btn-primary:hover { background: var(--brand-deep); border-color: var(--brand-deep); }
    .btn-ghost { background: transparent; border-color: transparent; box-shadow: none; }
    .btn-ghost:hover { background: var(--brand-soft); border-color: transparent; }
    .btn-danger-ghost { background: transparent; border-color: transparent; color: var(--danger); box-shadow: none; }
    .btn-danger-ghost:hover { background: var(--danger-soft); }

    /* pill */
    .pill {
      display: inline-flex;
      align-items: center;
      gap: 0.3rem;
      padding: 0.18rem 0.55rem;
      border-radius: 999px;
      font-size: 0.7rem;
      font-weight: 700;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }
    .pill-cash { background: var(--cash-soft); color: var(--cash); }
    .pill-pix  { background: var(--pix-soft);  color: var(--pix); }
    .pill-card { background: var(--card-soft); color: var(--card); }

    /* method chips */
    .method-grid {
      display: grid;
      grid-auto-flow: column;
      grid-auto-columns: 1fr;
      gap: 8px;
    }
    .method-chip {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.4rem;
      padding: 0.85rem 0.5rem;
      border-radius: 12px;
      border: 2px solid var(--rule);
      background: var(--surface);
      font-weight: 600;
      font-size: 0.95rem;
      color: var(--ink-soft);
      transition: all 120ms ease;
    }
    .method-chip:hover { border-color: var(--ink-soft); }
    .method-chip.selected-cash { border-color: var(--cash); background: var(--cash-soft); color: var(--cash); }
    .method-chip.selected-pix  { border-color: var(--pix);  background: var(--pix-soft);  color: var(--pix); }
    .method-chip.selected-card { border-color: var(--card); background: var(--card-soft); color: var(--card); }

    /* inputs */
    .field { display: block; width: 100%; }
    .field-label {
      display: block;
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 6px;
    }
    .field-input {
      width: 100%;
      padding: 0.75rem 0.9rem;
      border: 1.5px solid var(--rule);
      border-radius: 10px;
      background: var(--surface);
      font-size: 1rem;
      color: var(--ink);
      outline: none;
      transition: border-color 120ms ease, box-shadow 120ms ease;
    }
    .field-input:focus {
      border-color: var(--brand);
      box-shadow: 0 0 0 3px rgba(31, 37, 71, 0.1);
    }
    .field-input::placeholder { color: var(--muted); }

    .currency-input { position: relative; }
    .currency-input::before {
      content: 'R$';
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--muted);
      font-weight: 600;
      font-size: 0.95rem;
      pointer-events: none;
    }
    .currency-input input { padding-left: 38px; font-family: 'JetBrains Mono', monospace; font-weight: 600; }

    .big-amount input {
      font-size: 2rem;
      padding: 1rem 1rem 1rem 56px;
      letter-spacing: -0.02em;
      font-weight: 700;
    }
    .big-amount::before { font-size: 1.4rem; left: 18px; }

    /* category chips */
    .cat-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(110px, 1fr));
      gap: 8px;
    }
    .cat-chip {
      padding: 0.75rem 0.5rem;
      border: 1.5px solid var(--rule);
      border-radius: 10px;
      background: var(--surface);
      font-weight: 600;
      font-size: 0.88rem;
      color: var(--ink-soft);
      transition: all 120ms ease;
      text-align: center;
    }
    .cat-chip:hover { border-color: var(--ink-soft); transform: translateY(-1px); }
    .cat-chip.selected { border-color: var(--brand); background: var(--brand); color: #fff; }

    /* kind toggle */
    .kind-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .kind-btn {
      padding: 1.1rem 1rem;
      border: 2px solid var(--rule);
      border-radius: 14px;
      background: var(--surface);
      font-weight: 700;
      font-size: 1rem;
      color: var(--ink-soft);
      transition: all 120ms ease;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.4rem;
    }
    .kind-btn:hover { border-color: var(--ink-soft); }
    .kind-btn.selected-out { border-color: var(--danger); background: var(--danger-soft); color: var(--danger); }
    .kind-btn.selected-in  { border-color: var(--success); background: var(--cash-soft); color: var(--success); }

    /* modal */
    .modal-backdrop {
      position: fixed; inset: 0;
      background: rgba(20, 21, 42, 0.55);
      display: flex;
      align-items: flex-end;
      justify-content: center;
      z-index: 50;
      animation: fadein 150ms ease;
    }
    @media (min-width: 700px) {
      .modal-backdrop { align-items: center; padding: 20px; }
    }
    @keyframes fadein { from { opacity: 0; } to { opacity: 1; } }

    .modal {
      background: var(--surface);
      border-radius: 20px 20px 0 0;
      width: 100%;
      max-width: 520px;
      max-height: 92vh;
      overflow-y: auto;
      box-shadow: var(--shadow-lg);
      animation: slideup 200ms cubic-bezier(0.2, 0.8, 0.2, 1);
    }
    @media (min-width: 700px) {
      .modal { border-radius: 20px; max-height: 90vh; }
    }
    @keyframes slideup {
      from { transform: translateY(40px); opacity: 0.6; }
      to { transform: translateY(0); opacity: 1; }
    }

    .modal-header {
      position: sticky; top: 0;
      background: var(--surface);
      padding: 1rem 1.25rem;
      border-bottom: 1px solid var(--rule);
      display: flex;
      align-items: center;
      justify-content: space-between;
      z-index: 1;
    }
    .modal-body { padding: 1.25rem; }
    .modal-footer {
      position: sticky; bottom: 0;
      background: var(--surface);
      padding: 1rem 1.25rem;
      border-top: 1px solid var(--rule);
      display: flex;
      gap: 0.6rem;
    }

    /* list rows */
    .entry-row {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 14px 14px;
      border-bottom: 1px solid var(--rule);
      transition: background 120ms ease;
    }
    .entry-row:last-child { border-bottom: none; }
    .entry-row:hover { background: #fafbfd; }
    .entry-row .entry-icon {
      width: 38px;
      height: 38px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    .entry-row .entry-main { flex: 1; min-width: 0; }
    .entry-row .entry-desc {
      font-weight: 600;
      font-size: 0.95rem;
      color: var(--ink);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .entry-row .entry-meta {
      font-size: 0.75rem;
      color: var(--muted);
      margin-top: 2px;
    }
    .entry-row .entry-amount {
      font-weight: 700;
      font-size: 1rem;
      flex-shrink: 0;
    }
    .entry-amount.out { color: var(--danger); }
    .entry-amount.in  { color: var(--success); }

    .empty-state {
      text-align: center;
      padding: 3rem 1.5rem;
      color: var(--muted);
    }
    .empty-state .emoji { font-size: 2.5rem; margin-bottom: 0.5rem; opacity: 0.5; }

    /* summary cards */
    .summary-card {
      background: var(--surface);
      border-radius: var(--radius);
      padding: 1.15rem 1.25rem;
      box-shadow: var(--shadow-sm);
      border: 1px solid var(--rule);
    }
    .summary-card.featured {
      background: linear-gradient(135deg, var(--brand) 0%, var(--brand-deep) 100%);
      color: #fff;
      border: none;
      box-shadow: var(--shadow);
    }
    .summary-label {
      font-size: 0.7rem;
      font-weight: 700;
      letter-spacing: 0.07em;
      text-transform: uppercase;
      opacity: 0.7;
      margin-bottom: 6px;
    }
    .summary-value {
      font-size: 1.7rem;
      font-weight: 800;
      letter-spacing: -0.02em;
      line-height: 1;
    }
    .summary-card.featured .summary-value { font-size: 2rem; }

    /* header */
    .app-header {
      background: var(--surface);
      border-bottom: 1px solid var(--rule);
      position: sticky;
      top: 0;
      z-index: 10;
      box-shadow: var(--shadow-sm);
    }
    .header-inner {
      max-width: 720px;
      margin: 0 auto;
      padding: 12px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }
    .brand { display: flex; align-items: center; gap: 10px; }
    .brand img { height: 38px; width: auto; display: block; }
    .brand-text { display: flex; flex-direction: column; line-height: 1; }
    .brand-text .title {
      font-weight: 800;
      font-size: 0.95rem;
      letter-spacing: -0.01em;
      color: var(--ink);
    }
    .brand-text .subtitle {
      font-size: 0.72rem;
      color: var(--muted);
      margin-top: 2px;
    }
    .header-actions { display: flex; gap: 6px; }
    .icon-btn {
      width: 38px;
      height: 38px;
      border-radius: 10px;
      border: 1px solid var(--rule);
      background: var(--surface);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      color: var(--ink-soft);
      transition: all 120ms ease;
    }
    .icon-btn:hover { background: var(--brand-soft); color: var(--brand); border-color: var(--brand-soft); }
    .icon-btn.danger:hover { background: var(--danger-soft); color: var(--danger); border-color: var(--danger-soft); }

    /* content */
    .container {
      max-width: 720px;
      margin: 0 auto;
      padding: 16px;
      padding-bottom: 100px;
    }

    .section-title {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin: 1.6rem 0 0.6rem 0;
    }
    .section-title h2 {
      font-size: 0.85rem;
      font-weight: 700;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      color: var(--muted);
      margin: 0;
    }

    .panel {
      background: var(--surface);
      border-radius: var(--radius);
      box-shadow: var(--shadow-sm);
      border: 1px solid var(--rule);
      overflow: hidden;
    }

    .meta-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 14px;
      padding: 16px;
    }
    @media (min-width: 600px) {
      .meta-grid { grid-template-columns: 1fr 1fr 1fr; }
    }

    /* FAB */
    .fab {
      position: fixed;
      bottom: 22px;
      left: 50%;
      transform: translateX(-50%);
      background: var(--brand);
      color: #fff;
      border: none;
      padding: 14px 24px;
      border-radius: 999px;
      font-weight: 700;
      font-size: 1rem;
      box-shadow: 0 10px 28px -8px rgba(31, 37, 71, 0.5), 0 4px 10px -2px rgba(31, 37, 71, 0.2);
      display: inline-flex;
      align-items: center;
      gap: 8px;
      z-index: 20;
      transition: transform 150ms ease, box-shadow 150ms ease;
    }
    .fab:hover { transform: translateX(-50%) translateY(-2px); box-shadow: 0 14px 32px -8px rgba(31, 37, 71, 0.55); }
    .fab:active { transform: translateX(-50%) translateY(0); }

    .obs-textarea {
      width: 100%;
      min-height: 70px;
      padding: 14px;
      border: 1.5px solid var(--rule);
      border-radius: 12px;
      resize: vertical;
      font-size: 0.95rem;
      outline: none;
      background: var(--surface);
      color: var(--ink);
      transition: border-color 120ms;
    }
    .obs-textarea:focus { border-color: var(--brand); box-shadow: 0 0 0 3px rgba(31, 37, 71, 0.1); }

    .info-line {
      text-align: center;
      font-size: 0.75rem;
      color: var(--muted);
      margin-top: 1rem;
    }

    .confirm-dialog {
      max-width: 380px;
      padding: 1.5rem;
      text-align: center;
    }
    .confirm-dialog h3 { margin: 0 0 0.5rem 0; font-size: 1.1rem; }
    .confirm-dialog p { color: var(--ink-soft); margin: 0 0 1.2rem 0; font-size: 0.9rem; }
    .confirm-dialog .actions { display: flex; gap: 0.6rem; }
    .confirm-dialog .actions button { flex: 1; }

    .toast {
      position: fixed;
      bottom: 90px;
      left: 50%;
      transform: translateX(-50%);
      background: var(--ink);
      color: #fff;
      padding: 0.7rem 1.1rem;
      border-radius: 999px;
      font-size: 0.85rem;
      font-weight: 600;
      box-shadow: var(--shadow-lg);
      z-index: 30;
      animation: toastin 200ms ease, toastout 200ms ease 1.6s forwards;
    }
    @keyframes toastin { from { opacity: 0; transform: translate(-50%, 8px); } to { opacity: 1; transform: translate(-50%, 0); } }
    @keyframes toastout { to { opacity: 0; transform: translate(-50%, 8px); } }

    @media (max-width: 700px) {
      .kind-btn { font-size: 0.95rem; padding: 0.95rem 0.6rem; }
      .summary-value { font-size: 1.5rem; }
      .summary-card.featured .summary-value { font-size: 1.7rem; }
    }

    .totals-strip {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin: 8px 0 4px 0;
    }

    @media print { .no-print { display: none !important; } }
  </style>
</head>

      const local = new Date(d.getTime() - off * 60000);

    };

      if (!iso) return "";
      const [y, m, d] = iso.split("-");
      return `${d}/${m}/${y}`;
    };

    const uid = () => Math.random().toString(36).slice(2, 9);

    const num = (v) => {
      if (typeof v === "number") return v;
      if (!v) return 0;
      const cleaned = String(v).replace(/\./g, "").replace(",", ".");
      const n = parseFloat(cleaned);
      return Number.isFinite(n) ? n : 0;
    };

    const defaultState = () => ({
      data: todayISO(),
      responsavel: "",
      troco: "",
      lancamentos: [],
      observacoes: "",
    });

    const loadState = () => {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (!raw) return defaultState();
        const parsed = JSON.parse(raw);
        return { ...defaultState(), ...parsed };
      } catch {
        return defaultState();
      }
    };

    const Icon = ({ name, size = 20 }) => {
      const c = { width: size, height: size, viewBox: "0 0 24 24", fill: "none", stroke: "currentColor", strokeWidth: 2, strokeLinecap: "round", strokeLinejoin: "round" };
      switch (name) {
        case "plus":     return <svg {...c}><path d="M12 5v14M5 12h14" /></svg>;
        case "x":        return <svg {...c}><path d="M18 6 6 18M6 6l12 12" /></svg>;
        case "trash":    return <svg {...c}><path d="M3 6h18M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2m3 0v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6" /></svg>;
        case "download": return <svg {...c}><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M7 10l5 5 5-5M12 15V3" /></svg>;
        case "print":    return <svg {...c}><path d="M6 9V2h12v7M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2M6 14h12v8H6z" /></svg>;
        case "reset":    return <svg {...c}><path d="M3 12a9 9 0 1 0 3-6.7L3 8M3 3v5h5" /></svg>;
        case "arrow-down": return <svg {...c}><path d="M12 5v14M19 12l-7 7-7-7" /></svg>;
        case "arrow-up":   return <svg {...c}><path d="M12 19V5M5 12l7-7 7 7" /></svg>;
        case "check":    return <svg {...c}><path d="M20 6 9 17l-5-5" /></svg>;
      }
      return null;
    };

    function App() {
      const [state, setState] = useState(loadState);
      const [modal, setModal] = useState(null);
      const [confirm, setConfirm] = useState(null);
      const [toast, setToast] = useState(null);

      useEffect(() => {
        try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch {}
      }, [state]);

      const showToast = (msg) => {
        setToast(msg);
        setTimeout(() => setToast(null), 2000);
      };

      const totals = useMemo(() => {
        const troco = num(state.troco);
        let despesasCash = 0, despesasPix = 0;
        let entradaCash = 0, entradaCartao = 0, entradaPix = 0;
        for (const l of state.lancamentos) {
          const v = num(l.valor);
          if (l.tipo === "out") {
            if (l.metodo === "cash") despesasCash += v;
            else despesasPix += v;
          } else {
            if (l.metodo === "cash") entradaCash += v;
            else if (l.metodo === "cartao") entradaCartao += v;
            else if (l.metodo === "pix") entradaPix += v;
          }
        }
        const totalDespesas = despesasCash + despesasPix;
        const totalEntradas = entradaCash + entradaCartao + entradaPix;
        const saldoFinal = troco + totalEntradas - totalDespesas;
        const cashEmCaixa = troco + entradaCash - despesasCash;
        return { troco, totalDespesas, despesasCash, despesasPix, totalEntradas, entradaCash, entradaCartao, entradaPix, saldoFinal, cashEmCaixa };
      }, [state]);

      const update = (patch) => setState((s) => ({ ...s, ...patch }));

      const upsertEntry = (entry) => {
        setState((s) => {
          const exists = s.lancamentos.find((x) => x.id === entry.id);
          if (exists) {
            return { ...s, lancamentos: s.lancamentos.map((x) => (x.id === entry.id ? entry : x)) };
          }
          return { ...s, lancamentos: [entry, ...s.lancamentos] };
        });
      };
      const removeEntry = (id) =>
        setState((s) => ({ ...s, lancamentos: s.lancamentos.filter((x) => x.id !== id) }));

      const askReset = () => {
        setConfirm({
          title: "Iniciar novo dia?",
          message: "Todos os lançamentos atuais serão apagados. Exporte o PDF antes se quiser guardar.",
          confirmLabel: "Sim, reiniciar",
          danger: true,
          onYes: () => { setState(defaultState()); showToast("Pronto para um novo dia"); },
        });
      };

      const askDelete = (entry) => {
        setConfirm({
          title: "Remover lançamento?",
          message: `${entry.descricao || "(sem descrição)"} — ${fmtBRL(num(entry.valor))}`,
          confirmLabel: "Remover",
          danger: true,
          onYes: () => { removeEntry(entry.id); showToast("Removido"); },
        });
      };

      const exportPDF = () => {
        if (!window.jspdf) { showToast("Carregando biblioteca…"); return; }
        const { jsPDF } = window.jspdf;
        const doc = new jsPDF({ unit: "mm", format: "a4", orientation: "portrait" });

        const PAGE_W = 210;
        const MARGIN_X = 22;
        const X0 = MARGIN_X;
        const X1 = PAGE_W - MARGIN_X;
        const W = X1 - X0;
        const COL_SPLIT = X0 + W * 0.55;
        let y = 18;

        const BORDER = 0.6;
        const BLACK = [0, 0, 0];
        const WHITE = [255, 255, 255];

        const setFont = (style = "normal", size = 10) => {
          doc.setFont("helvetica", style);
          doc.setFontSize(size);
        };
        const rect = (x, yy, w, h) => {
          doc.setDrawColor(0);
          doc.setLineWidth(BORDER);
          doc.rect(x, yy, w, h, "S");
        };
        const fillRect = (x, yy, w, h) => {
          doc.setFillColor(...BLACK);
          doc.setDrawColor(0);
          doc.setLineWidth(BORDER);
          doc.rect(x, yy, w, h, "FD");
        };
        const cellText = (txt, x, yy, h, opts = {}) => {
          const { align = "left", color = BLACK, fontStyle = "normal", fontSize = 10, padX = 2, cellW = null } = opts;
          setFont(fontStyle, fontSize);
          doc.setTextColor(...color);
          let tx = x + padX;
          if (align === "center" && cellW != null) tx = x + cellW / 2;
          if (align === "right" && cellW != null) tx = x + cellW - padX;
          const ty = yy + h / 2 + (fontSize * 0.35) / 2.83;
          doc.text(String(txt ?? ""), tx, ty, { align });
        };

        // Header com logo (no espaço em branco acima da DATA)
        const HDR_H = 28;
        rect(X0, y, W, HDR_H);
        try {
          const logoH = 22;
          const logoW = logoH * (205 / 135);
          const lx = X0 + (W - logoW) / 2;
          const ly = y + (HDR_H - logoH) / 2;
          doc.addImage(LOGO_DATA_URL_PDF, "PNG", lx, ly, logoW, logoH);
        } catch (e) { console.warn("logo error", e); }
        y += HDR_H;

        const META_H = 8;
        const drawLabelValueRow = (label, value, opts = {}) => {
          rect(X0, y, COL_SPLIT - X0, META_H);
          rect(COL_SPLIT, y, X1 - COL_SPLIT, META_H);
          cellText(label, X0, y, META_H, { fontStyle: "bold", fontSize: opts.labelSize || 11, padX: 3 });
          if (value != null && value !== "") {
            cellText(value, COL_SPLIT, y, META_H, { align: "center", fontStyle: opts.valueBold ? "bold" : "normal", fontSize: opts.valueSize || 11, cellW: X1 - COL_SPLIT });
          }
          y += META_H;
        };
        drawLabelValueRow("DATA", fmtDateBR(state.data), { valueBold: true });
        drawLabelValueRow("RESPONSÁVEL", state.responsavel || "", { valueBold: true });
        drawLabelValueRow("SALDO", "");
        drawLabelValueRow("SALDO INICIAL (TROCO)", fmtBRL(totals.troco), { labelSize: 9 });

        const BANNER_H = 14;
        fillRect(X0, y, W, BANNER_H);
        cellText("DESPESAS DIVERSAS", X0, y, BANNER_H, { align: "center", color: WHITE, fontStyle: "bold", fontSize: 18, cellW: W });
        y += BANNER_H;

        const ROW_H = 8.5;
        const despesas = state.lancamentos.filter((l) => l.tipo === "out");
        const padDespesas = despesas.length === 0 ? 5 : Math.max(0, 5 - despesas.length);
        for (const e of despesas) {
          rect(X0, y, COL_SPLIT - X0, ROW_H);
          rect(COL_SPLIT, y, X1 - COL_SPLIT, ROW_H);
          let label = (e.descricao || "").toUpperCase();
          if (e.metodo === "pix") label = label ? `${label} (PIX)` : "(PIX)";
          cellText(label, X0, y, ROW_H, { align: "center", fontStyle: "bold", fontSize: 11, cellW: COL_SPLIT - X0 });
          const v = num(e.valor);
          cellText(v ? fmtBRL(v) : "", COL_SPLIT, y, ROW_H, { align: "center", fontSize: 11, cellW: X1 - COL_SPLIT });
          y += ROW_H;
        }
        for (let i = 0; i < padDespesas; i++) {
          rect(X0, y, COL_SPLIT - X0, ROW_H);
          rect(COL_SPLIT, y, X1 - COL_SPLIT, ROW_H);
          y += ROW_H;
        }

        const TOTAL_H = 11;
        rect(X0, y, COL_SPLIT - X0, TOTAL_H);
        rect(COL_SPLIT, y, X1 - COL_SPLIT, TOTAL_H);
        cellText("TOTAL DE DESPESAS", X0, y, TOTAL_H, { align: "center", fontSize: 11, cellW: COL_SPLIT - X0 });
        cellText(fmtBRL(totals.totalDespesas), COL_SPLIT, y, TOTAL_H, { align: "center", fontStyle: "bold", fontSize: 16, cellW: X1 - COL_SPLIT });
        y += TOTAL_H;

        y += 2;

        fillRect(X0, y, W, BANNER_H);
        cellText("ENTRADAS DIVERSAS", X0, y, BANNER_H, { align: "center", color: WHITE, fontStyle: "bold", fontSize: 18, cellW: W });
        y += BANNER_H;

        const incomeByMethod = [
          { label: "ENTRADA CASH",   value: totals.entradaCash },
          { label: "ENTRADA CARTÃO", value: totals.entradaCartao },
          { label: "ENTRADA PIX",    value: totals.entradaPix },
        ];
        for (const r of incomeByMethod) {
          rect(X0, y, COL_SPLIT - X0, ROW_H);
          rect(COL_SPLIT, y, X1 - COL_SPLIT, ROW_H);
          cellText(r.label, X0, y, ROW_H, { align: "center", fontStyle: "bold", fontSize: 11, cellW: COL_SPLIT - X0 });
          cellText(r.value ? fmtBRL(r.value) : "", COL_SPLIT, y, ROW_H, { align: "center", fontSize: 11, cellW: X1 - COL_SPLIT });
          y += ROW_H;
        }

        rect(X0, y, COL_SPLIT - X0, TOTAL_H);
        rect(COL_SPLIT, y, X1 - COL_SPLIT, TOTAL_H);
        cellText("TOTAL DE ENTRADAS", X0, y, TOTAL_H, { align: "center", fontSize: 11, cellW: COL_SPLIT - X0 });
        cellText(fmtBRL(totals.totalEntradas), COL_SPLIT, y, TOTAL_H, { align: "center", fontSize: 14, cellW: X1 - COL_SPLIT });
        y += TOTAL_H;

        const SF_H = 14;
        rect(X0, y, COL_SPLIT - X0, SF_H);
        rect(COL_SPLIT, y, X1 - COL_SPLIT, SF_H);
        setFont("normal", 11); doc.setTextColor(0);
        doc.text("SALDO FINAL", X0 + (COL_SPLIT - X0) / 2, y + 6, { align: "center" });
        setFont("bold", 7);
        doc.text("ENTRADAS - DESPESAS + TROCO", X0 + (COL_SPLIT - X0) / 2, y + 11, { align: "center" });
        cellText(fmtBRL(totals.saldoFinal), COL_SPLIT, y, SF_H, { align: "center", fontStyle: "bold", fontSize: 18, cellW: X1 - COL_SPLIT });
        y += SF_H;

        y += 2;

        const OBS_HEAD_H = 8;
        rect(X0, y, W, OBS_HEAD_H);
        cellText("OBSERVAÇÕES", X0, y, OBS_HEAD_H, { align: "center", fontStyle: "bold", fontSize: 11, cellW: W });
        y += OBS_HEAD_H;

        const OBS_BODY_H = 14;
        rect(X0, y, W, OBS_BODY_H);
        if (state.observacoes) {
          setFont("normal", 9); doc.setTextColor(0);
          const lines = doc.splitTextToSize(state.observacoes, W - 6);
          doc.text(lines.slice(0, 3), X0 + 3, y + 5);
        }
        y += OBS_BODY_H;

        const CASH_H = 14;
        rect(X0, y, W, CASH_H);
        setFont("bold", 13); doc.setTextColor(0);
        doc.text("TOTAL DE CASH EM CAIXA  =", X0 + W * 0.55 - 4, y + CASH_H / 2 + 2, { align: "right" });
        setFont("bold", 18);
        doc.text(fmtBRL(totals.cashEmCaixa), X0 + W * 0.55 + 4, y + CASH_H / 2 + 2.5, { align: "left" });
        y += CASH_H;

        y += 4;
        setFont("italic", 8); doc.setTextColor(120);
        const footer = `${fmtDateBR(state.data) || ""}${state.responsavel ? " · " + state.responsavel : ""}`;
        if (footer.trim()) doc.text(footer, X0, y);
        doc.text("Gerado em " + new Date().toLocaleString("pt-BR"), X1, y, { align: "right" });

        const dateForFile = (state.data || todayISO()).replace(/-/g, "");
        doc.save(`caixa_${dateForFile}.pdf`);
        showToast("PDF gerado");
      };

      const despesasList = state.lancamentos.filter((l) => l.tipo === "out");
      const entradasList = state.lancamentos.filter((l) => l.tipo === "in");

      return (
        <div>
          <header className="app-header">
            <div className="header-inner">
              <div className="brand">
                <img src={LOGO_DATA_URL} alt="AAA" />
                <div className="brand-text">
                  <span className="title">Caixa AAA</span>
                  <span className="subtitle">{fmtDateBR(state.data)}</span>
                </div>
              </div>
              <div className="header-actions no-print">
                <button className="icon-btn" onClick={exportPDF} title="Exportar PDF" aria-label="Exportar PDF">
                  <Icon name="download" size={18} />
                </button>
                <button className="icon-btn" onClick={() => window.print()} title="Imprimir" aria-label="Imprimir">
                  <Icon name="print" size={18} />
                </button>
                <button className="icon-btn danger" onClick={askReset} title="Reiniciar dia" aria-label="Reiniciar">
                  <Icon name="reset" size={18} />
                </button>
              </div>
            </div>
          </header>

          <div className="container">
            <div className="totals-strip">
              <div className="summary-card featured">
                <div className="summary-label">Saldo final</div>
                <div className="summary-value mono">{fmtBRL(totals.saldoFinal)}</div>
              </div>
              <div className="summary-card">
                <div className="summary-label" style={{ color: "var(--cash)" }}>Cash em caixa</div>
                <div className="summary-value mono" style={{ color: "var(--cash)" }}>{fmtBRL(totals.cashEmCaixa)}</div>
              </div>
            </div>

            <div className="section-title"><h2>Cabeçalho</h2></div>
            <div className="panel">
              <div className="meta-grid">
                <div className="field">
                  <label className="field-label">Data</label>
                  <input
                    type="date"
                    className="field-input mono"
                    value={state.data}
                    onChange={(e) => update({ data: e.target.value })}
                  />
                </div>
                <div className="field">
                  <label className="field-label">Responsável</label>
                  <input
                    type="text"
                    className="field-input"
                    placeholder="Nome do responsável"
                    value={state.responsavel}
                    onChange={(e) => update({ responsavel: e.target.value })}
                  />
                </div>
                <div className="field">
                  <label className="field-label">Saldo inicial · troco</label>
                  <div className="currency-input">
                    <input
                      type="text"
                      inputMode="decimal"
                      className="field-input"
                      placeholder="0,00"
                      value={state.troco}
                      onChange={(e) => update({ troco: e.target.value.replace(/[^\d,.\-]/g, "") })}
                    />
                  </div>
                </div>
              </div>
            </div>

            <div className="section-title">
              <h2>Despesas {despesasList.length > 0 && `· ${despesasList.length}`}</h2>
              <span className="mono" style={{ color: "var(--danger)", fontWeight: 700, fontSize: "0.95rem" }}>
                {fmtBRL(totals.totalDespesas)}
              </span>
            </div>
            <div className="panel">
              {despesasList.length === 0 ? (
                <div className="empty-state">
                  <div className="emoji">↘</div>
                  <div>Nenhuma despesa lançada ainda</div>
                </div>
              ) : (
                despesasList.map((l) => (
                  <EntryRow
                    key={l.id}
                    entry={l}
                    onClick={() => setModal({ mode: "edit", entry: l })}
                    onDelete={() => askDelete(l)}
                  />
                ))
              )}
            </div>

            <div className="section-title">
              <h2>Entradas {entradasList.length > 0 && `· ${entradasList.length}`}</h2>
              <span className="mono" style={{ color: "var(--success)", fontWeight: 700, fontSize: "0.95rem" }}>
                {fmtBRL(totals.totalEntradas)}
              </span>
            </div>
            <div className="panel">
              {entradasList.length === 0 ? (
                <div className="empty-state">
                  <div className="emoji">↗</div>
                  <div>Nenhuma entrada lançada ainda</div>
                </div>
              ) : (
                entradasList.map((l) => (
                  <EntryRow
                    key={l.id}
                    entry={l}
                    onClick={() => setModal({ mode: "edit", entry: l })}
                    onDelete={() => askDelete(l)}
                  />
                ))
              )}
            </div>

            <div className="section-title"><h2>Observações</h2></div>
            <textarea
              className="obs-textarea"
              placeholder="Anotações livres sobre o dia…"
              value={state.observacoes}
              onChange={(e) => update({ observacoes: e.target.value })}
            />

            <p className="info-line">Os dados ficam salvos apenas neste navegador. Exporte o PDF ao fim do dia.</p>
          </div>

          <button className="fab no-print" onClick={() => setModal({ mode: "new" })}>
            <Icon name="plus" /> Adicionar lançamento
          </button>

          {modal && (
            <EntryModal
              modal={modal}
              onClose={() => setModal(null)}
              onSave={(entry) => { upsertEntry(entry); setModal(null); showToast(modal.mode === "edit" ? "Atualizado" : "Lançado"); }}
              onDelete={(entry) => { setModal(null); askDelete(entry); }}
            />
          )}

          {confirm && (
            <ConfirmDialog
              {...confirm}
              onClose={() => setConfirm(null)}
              onConfirm={() => { confirm.onYes(); setConfirm(null); }}
            />
          )}

          {toast && <div className="toast">{toast}</div>}
        </div>
      );
    }

    function EntryRow({ entry, onClick, onDelete }) {
      const isOut = entry.tipo === "out";
      const v = num(entry.valor);
      const methodLabel = entry.metodo === "cash" ? "Cash" : entry.metodo === "pix" ? "Pix" : "Cartão";
      const pillClass = `pill-${entry.metodo === "cartao" ? "card" : entry.metodo}`;
      const iconBg = isOut ? "var(--danger-soft)" : "var(--cash-soft)";
      const iconColor = isOut ? "var(--danger)" : "var(--success)";
      return (
        <div className="entry-row">
          <div className="entry-icon" style={{ background: iconBg, color: iconColor }}>
            <Icon name={isOut ? "arrow-down" : "arrow-up"} size={18} />
          </div>
          <div className="entry-main" onClick={onClick} style={{ cursor: "pointer" }}>
            <div className="entry-desc">{entry.descricao || "(sem descrição)"}</div>
            <div className="entry-meta">
              <span className={`pill ${pillClass}`}>{methodLabel}</span>
            </div>
          </div>
          <div className={`entry-amount mono ${isOut ? "out" : "in"}`}>
            {isOut ? "−" : "+"}{fmtBRL(v)}
          </div>
          <button className="icon-btn danger no-print" onClick={onDelete} aria-label="Remover" style={{ width: 34, height: 34 }}>
            <Icon name="trash" size={16} />
          </button>
        </div>
      );
    }

    function EntryModal({ modal, onClose, onSave, onDelete }) {
      const isEdit = modal.mode === "edit";
      const [tipo, setTipo] = useState(modal.entry?.tipo || "out");
      const [descricao, setDescricao] = useState(modal.entry?.descricao || "");
      const [metodo, setMetodo] = useState(modal.entry?.metodo || "cash");
      const [valor, setValor] = useState(modal.entry?.valor || "");
      const valorRef = useRef(null);

      useEffect(() => {
        if (tipo === "out" && metodo === "cartao") setMetodo("cash");
      }, [tipo]);

      useEffect(() => {
        if (!isEdit) {
          setTimeout(() => valorRef.current?.focus(), 250);
        }
      }, []);

      const sugestoes = tipo === "out" ? SUGESTOES_DESPESA : SUGESTOES_ENTRADA;
      const isCustom = descricao && !sugestoes.includes(descricao);
      const canSave = num(valor) > 0;

      const save = () => {
        if (!canSave) return;
        const entry = {
          id: modal.entry?.id || uid(),
          tipo,
          descricao: descricao.trim(),
          metodo,
          valor,
          criadoEm: modal.entry?.criadoEm || new Date().toISOString(),
        };
        onSave(entry);
      };

      const handleBackdrop = (e) => {
        if (e.target === e.currentTarget) onClose();
      };

      const methodOptions = tipo === "out"
        ? [{ value: "cash", label: "Cash" }, { value: "pix", label: "Pix" }]
        : [{ value: "cash", label: "Cash" }, { value: "pix", label: "Pix" }, { value: "cartao", label: "Cartão" }];

      return (
        <div className="modal-backdrop no-print" onClick={handleBackdrop}>
          <div className="modal" role="dialog" aria-modal="true">
            <div className="modal-header">
              <strong style={{ fontSize: "1.05rem" }}>
                {isEdit ? "Editar lançamento" : "Novo lançamento"}
              </strong>
              <button className="icon-btn" onClick={onClose} aria-label="Fechar">
                <Icon name="x" size={18} />
              </button>
            </div>

            <div className="modal-body">
              <div className="field" style={{ marginBottom: 18 }}>
                <label className="field-label">Tipo</label>
                <div className="kind-grid">
                  <button
                    type="button"
                    className={`kind-btn ${tipo === "out" ? "selected-out" : ""}`}
                    onClick={() => setTipo("out")}
                  >
                    <Icon name="arrow-down" size={22} />
                    Despesa
                  </button>
                  <button
                    type="button"
                    className={`kind-btn ${tipo === "in" ? "selected-in" : ""}`}
                    onClick={() => setTipo("in")}
                  >
                    <Icon name="arrow-up" size={22} />
                    Entrada
                  </button>
                </div>
              </div>

              <div className="field" style={{ marginBottom: 18 }}>
                <label className="field-label">Valor</label>
                <div className="currency-input big-amount">
                  <input
                    ref={valorRef}
                    type="text"
                    inputMode="decimal"
                    placeholder="0,00"
                    value={valor}
                    onChange={(e) => setValor(e.target.value.replace(/[^\d,.\-]/g, ""))}
                    onKeyDown={(e) => { if (e.key === "Enter" && canSave) save(); }}
                  />
                </div>
              </div>

              <div className="field" style={{ marginBottom: 18 }}>
                <label className="field-label">Categoria</label>
                <div className="cat-grid">
                  {sugestoes.map((s) => (
                    <button
                      key={s}
                      type="button"
                      className={`cat-chip ${descricao === s ? "selected" : ""}`}
                      onClick={() => setDescricao(s)}
                    >
                      {s}
                    </button>
                  ))}
                </div>
                <input
                  type="text"
                  className="field-input"
                  style={{ marginTop: 8 }}
                  placeholder="Ou digite uma descrição personalizada"
                  value={isCustom ? descricao : ""}
                  onChange={(e) => setDescricao(e.target.value)}
                />
              </div>

              <div className="field">
                <label className="field-label">Forma de pagamento</label>
                <div className="method-grid">
                  {methodOptions.map((opt) => {
                    const sel = metodo === opt.value;
                    const cls = sel
                      ? opt.value === "cash" ? "selected-cash"
                      : opt.value === "pix"  ? "selected-pix"
                      : "selected-card"
                      : "";
                    return (
                      <button key={opt.value} type="button" className={`method-chip ${cls}`} onClick={() => setMetodo(opt.value)}>
                        {opt.label}
                      </button>
                    );
                  })}
                </div>
                <p style={{ fontSize: "0.78rem", color: "var(--muted)", marginTop: 8, marginBottom: 0 }}>
                  {tipo === "out"
                    ? metodo === "cash"
                      ? "Será descontado do cash em caixa."
                      : "Não desconta do cash em caixa, apenas do saldo final."
                    : metodo === "cash"
                      ? "Entra no cash em caixa."
                      : "Não entra no cash, apenas no saldo final."}
                </p>
              </div>
            </div>

            <div className="modal-footer">
              {isEdit && (
                <button className="btn btn-danger-ghost" onClick={() => onDelete(modal.entry)}>
                  <Icon name="trash" size={16} /> Remover
                </button>
              )}
              <button className="btn" onClick={onClose} style={{ marginLeft: "auto" }}>Cancelar</button>
              <button className="btn btn-primary" onClick={save} disabled={!canSave} style={{ opacity: canSave ? 1 : 0.4 }}>
                <Icon name="check" size={16} /> Salvar
              </button>
            </div>
          </div>
        </div>
      );
    }

    function ConfirmDialog({ title, message, confirmLabel = "Confirmar", danger, onConfirm, onClose }) {
      return (
        <div className="modal-backdrop no-print" onClick={(e) => e.target === e.currentTarget && onClose()}>
          <div className="modal confirm-dialog">
            <h3>{title}</h3>
            <p>{message}</p>
            <div className="actions">
              <button className="btn" onClick={onClose}>Cancelar</button>
              <button
                className={`btn ${danger ? "" : "btn-primary"}`}
                onClick={onConfirm}
                style={danger ? { background: "var(--danger)", color: "#fff", borderColor: "var(--danger)" } : {}}
              >
                {confirmLabel}
              </button>
            </div>
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<App />);
  </script>
</body>
</html>
